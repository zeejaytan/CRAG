model_summary:
  _target_: lightning.pytorch.callbacks.RichModelSummary

progress_bar:
  _target_: lightning.pytorch.callbacks.TQDMProgressBar
  leave: True

visualization_saving:
  _target_: source.callbacks.vis_saving.VisualizationSavingCallback
  save_dir: ./output/${experiment_name}/visualizations