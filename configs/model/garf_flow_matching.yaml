defaults:
  - /model@encoder: encoder/ptv3

_target_: source.models.garf_flow_matching.GarfFlowMatchingModel
_recursive_: False
encoder_ckpt: ./pretrained/GARF.ckpt
transformer_kwargs:
  in_dim: 64
  width: 512
  num_heads: 8
  num_layers: 6
noise_scheduler:
  _target_: source.modules.scheduler.SE3FlowMatchEulerDiscreteScheduler
  num_train_timesteps: 1000
val_noise_scheduler:
  _target_: source.modules.scheduler.SE3FlowMatchEulerDiscreteScheduler
  num_train_timesteps: 1000
optimizer:
  _target_: torch.optim.AdamW
  lr: 2e-4
  betas: [0.95, 0.999]
  weight_decay: 1e-6
  eps: 1e-8
lr_scheduler:
  _target_: torch.optim.lr_scheduler.MultiStepLR
  milestones: [900, 1200]
  gamma: 0.5